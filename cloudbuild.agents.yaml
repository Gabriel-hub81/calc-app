# Construye la imagen de los agentes (Cloud Run Jobs).
#   gcloud builds submit --config=cloudbuild.agents.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.agents
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/calc-agents:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/calc-agents:latest
options:
  logging: CLOUD_LOGGING_ONLY
